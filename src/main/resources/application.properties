# =========================================================
# Inventory Management System - Phase 1 (Local Configuration)
# =========================================================

# ---- Server ----
server.port=8080

# ---- Application ----
spring.application.name=inventory-management

# ---- MySQL Datasource ----
# Create the database first:  CREATE DATABASE inventory_db;
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update: auto-creates/updates tables based on entities (fine for dev, Phase 1/2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
# Set to true in production for performance; false while developing so templates hot-reload
spring.thymeleaf.cache=false

# ---- Low stock default threshold (used when seeding demo data) ----
inventory.default-low-stock-threshold=10