# =========================================================
# Inventory Management System - Phase 1 (Local Configuration)
# =========================================================

# ---- Server ----
server.port=8080

# ---- Application ----
spring.application.name=inventory-management

# ---- MySQL Datasource ----
# Create the database first:  CREATE DATABASE inventory_db;
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=shubh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Low stock default threshold (used when seeding demo data) ----
inventory.default-low-stock-threshold=10

#server.error.include-message=always
#server.error.include-stacktrace=always
#server.error.include-exception=true

