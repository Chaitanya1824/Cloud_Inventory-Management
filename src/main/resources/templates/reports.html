<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Reports & Analytics')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container-fluid px-4">
    <h4 class="section-title mb-4"><i class="bi bi-graph-up me-2"></i>Reports &amp; Analytics</h4>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card stat-card p-3 text-center">
                <div class="text-muted small">Total Products</div>
                <div class="fs-3 fw-bold" th:text="${totalProducts}"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card p-3 text-center">
                <div class="text-muted small">Total Units in Stock</div>
                <div class="fs-3 fw-bold" th:text="${totalUnits}"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card p-3 text-center">
                <div class="text-muted small">Total Inventory Value</div>
                <div class="fs-3 fw-bold">&#8377;<span th:text="${#numbers.formatDecimal(totalValue, 0, 'COMMA', 2, 'POINT')}"></span></div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-lg-4">
            <div class="card p-3 h-100">
                <h6 class="section-title mb-3">Stock Status Breakdown</h6>
                <canvas id="statusChart" height="220"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-3 h-100">
                <h6 class="section-title mb-3">Products by Category</h6>
                <canvas id="categoryCountChart" height="220"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-3 h-100">
                <h6 class="section-title mb-3">Inventory Value by Category (&#8377;)</h6>
                <canvas id="categoryValueChart" height="220"></canvas>
            </div>
        </div>
    </div>

    <div class="card p-3 mb-4">
        <h6 class="section-title mb-3"><i class="bi bi-trophy-fill text-warning me-1"></i>Top 10 Products by Inventory Value</h6>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th>SKU</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total Value</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p, iter : ${topProducts}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.sku}"></td>
                    <td th:text="${p.category != null ? p.category.name : 'Uncategorized'}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td>&#8377;<span th:text="${#numbers.formatDecimal(p.unitPrice, 0, 'COMMA', 2, 'POINT')}"></span></td>
                    <td>&#8377;<span th:text="${#numbers.formatDecimal(p.totalValue, 0, 'COMMA', 2, 'POINT')}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(topProducts)}">
                    <td colspan="7" class="text-center text-muted py-3">No product data available yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const statusLabels = /*[[${stockStatusBreakdown.keySet()}]]*/ [];
    const statusData = /*[[${stockStatusBreakdown.values()}]]*/ [];

    new Chart(document.getElementById('statusChart'), {
        type: 'pie',
        data: {
            labels: statusLabels,
            datasets: [{
                data: statusData,
                backgroundColor: ['#198754', '#ffc107', '#dc3545']
            }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });

    const catLabels = /*[[${categoryDistribution.keySet()}]]*/ [];
    const catData = /*[[${categoryDistribution.values()}]]*/ [];

    new Chart(document.getElementById('categoryCountChart'), {
        type: 'bar',
        data: {
            labels: catLabels,
            datasets: [{ label: 'Products', data: catData, backgroundColor: '#0d6efd' }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
    });

    const valueLabels = /*[[${valueByCategory.keySet()}]]*/ [];
    const valueData = /*[[${valueByCategory.values()}]]*/ [];

    new Chart(document.getElementById('categoryValueChart'), {
        type: 'bar',
        data: {
            labels: valueLabels,
            datasets: [{ label: 'Inventory Value', data: valueData, backgroundColor: '#20c997' }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
    });
</script>
</body>
</html>
