<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Adjust Stock')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container-fluid px-4">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h4 class="section-title mb-3"><i class="bi bi-arrow-repeat me-2"></i>Adjust Stock</h4>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card p-4">
                <h5 th:text="${product.name}"></h5>
                <p class="text-muted mb-2">SKU: <span th:text="${product.sku}"></span></p>
                <p class="mb-1">Current Quantity:
                    <strong th:text="${product.quantity}"></strong>
                    <span class="badge ms-2" th:classappend="${product.stockStatusBadgeClass}" th:text="${product.stockStatusLabel}"></span>
                </p>
                <p class="text-muted mb-4">Low stock threshold: <span th:text="${product.lowStockThreshold}"></span></p>

                <form th:action="@{/products/{id}/stock(id=${product.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Action</label>
                        <select class="form-select" name="type" required>
                            <option value="STOCK_IN">Stock In (goods received)</option>
                            <option value="STOCK_OUT">Stock Out (goods sold / used)</option>
                            <option value="ADJUSTMENT">Adjustment (set exact quantity)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" min="1" class="form-control" name="quantity" required/>
                        <div class="form-text">For "Adjustment", enter the new total quantity on hand.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Note</label>
                        <input type="text" class="form-control" name="note" placeholder="e.g. Purchase order #1023"/>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Update Stock</button>
                        <a href="/products" class="btn btn-outline-secondary">Back to Inventory</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card p-4">
                <h6 class="section-title mb-3">Transaction History</h6>
                <div class="table-responsive" style="max-height: 420px; overflow-y:auto;">
                    <table class="table table-sm table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Change</th>
                            <th>Before &rarr; After</th>
                            <th>Note</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tx : ${history}">
                            <td th:text="${#temporals.format(tx.timestamp, 'dd-MMM-yyyy HH:mm')}"></td>
                            <td>
                                <span class="badge bg-success" th:if="${tx.type.name() == 'STOCK_IN'}">Stock In</span>
                                <span class="badge bg-danger" th:if="${tx.type.name() == 'STOCK_OUT'}">Stock Out</span>
                                <span class="badge bg-secondary" th:if="${tx.type.name() == 'ADJUSTMENT'}">Adjustment</span>
                            </td>
                            <td th:text="${tx.quantityChanged}"></td>
                            <td th:text="${tx.previousQuantity} + ' &rarr; ' + ${tx.newQuantity}"></td>
                            <td th:text="${tx.note}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(history)}">
                            <td colspan="5" class="text-center text-muted py-3">No stock movements recorded yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
