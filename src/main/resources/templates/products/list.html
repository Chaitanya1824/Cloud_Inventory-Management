<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Products')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container-fluid px-4">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="section-title mb-0"><i class="bi bi-box-seam me-2"></i>Product Inventory</h4>
        <a href="/products/new" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Product</a>
    </div>

    <!-- Search / filter bar -->
    <div class="card p-3 mb-3">
        <form method="get" th:action="@{/products}" class="row g-2 align-items-center">
            <div class="col-md-4">
                <input type="text" class="form-control" name="keyword" placeholder="Search by name or SKU..."
                       th:value="${keyword}"/>
            </div>
            <div class="col-md-3">
                <select class="form-select" name="categoryId">
                    <option value="">All Categories</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" name="status">
                    <option value="">All Statuses</option>
                    <option value="IN_STOCK" th:selected="${selectedStatus == 'IN_STOCK'}">In Stock</option>
                    <option value="LOW_STOCK" th:selected="${selectedStatus == 'LOW_STOCK'}">Low Stock</option>
                    <option value="OUT_OF_STOCK" th:selected="${selectedStatus == 'OUT_OF_STOCK'}">Out of Stock</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search me-1"></i>Filter</button>
            </div>
        </form>
    </div>

    <!-- Inventory table -->
    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>SKU</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total Value</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.sku}"></td>
                    <td th:text="${p.name}"></td>
                    <td>
                        <span th:if="${p.category != null}" th:text="${p.category.name}"></span>
                        <span th:unless="${p.category != null}" class="text-muted">Uncategorized</span>
                    </td>
                    <td th:text="${p.quantity}"></td>
                    <td>&#8377;<span th:text="${#numbers.formatDecimal(p.unitPrice, 0, 'COMMA', 2, 'POINT')}"></span></td>
                    <td>&#8377;<span th:text="${#numbers.formatDecimal(p.totalValue, 0, 'COMMA', 2, 'POINT')}"></span></td>
                    <td><span class="badge" th:classappend="${p.stockStatusBadgeClass}" th:text="${p.stockStatusLabel}"></span></td>
                    <td class="text-end">
                        <a th:href="@{/products/{id}/stock(id=${p.id})}" class="btn btn-sm btn-outline-success" title="Adjust Stock">
                            <i class="bi bi-arrow-repeat"></i>
                        </a>
                        <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this product? This cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="8" class="text-center text-muted py-4">No products found. Try adjusting your filters or add a new product.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
